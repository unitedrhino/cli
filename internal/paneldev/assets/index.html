<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>设备开关</title>
  <style>body{font:16px system-ui;padding:24px}button{padding:12px 24px}pre{white-space:pre-wrap}</style>
</head>
<body>
  <h1>设备开关</h1>
  <p id="state">正在读取设备状态…</p>
  <button id="toggle" disabled>切换开关</button>
  <pre id="result"></pre>
  <script src="panel-sdk.js"></script>
  <script>
    /* 文件说明：仅用宿主 SDK 控制当前设备；受理与设备确认分别显示，未知值不冒充关闭。 */
    const output = document.querySelector('#result'), button = document.querySelector('#toggle');
    let power = null, canWrite = false;
    /** render 展示原始质量，只有已知布尔值和实际写权限才启用切换。 */
    function render(values) {
      const field = values.power;
      if (!field) return;
      power = typeof field.value === 'boolean' ? field.value : null;
      document.querySelector('#state').textContent = `开关：${power === null ? '未知' : power ? '开' : '关'} · 质量：${field.quality || '未知'}`;
      button.disabled = !canWrite || power === null;
    }
    /** start 先获取宿主实际能力，再订阅属性与命令，连接事件不覆盖最终执行结果。 */
    async function start() {
      try {
        output.textContent = JSON.stringify(await urPanel.getContext(), null, 2);
        const model = await urPanel.getThingModel();
        canWrite = model.properties.some(field => field.identifier === 'power' && field.available !== false && field.mode === 'rw');
        render(await urPanel.readProperties({identifiers: ['power']}));
        await urPanel.subscribe({topics: ['property', 'command', 'connection']}, event => {
          if (event.topic === 'property') render(event.data);
          else if (event.topic === 'command') output.textContent = JSON.stringify(event, null, 2);
        });
      } catch (error) { output.textContent = error.message; }
    }
    /** toggle 只发送一次控制；失败由用户决定重试，accepted 不代表设备已生效。 */
    button.onclick = async function toggle() {
      button.disabled = true;
      try { output.textContent = JSON.stringify(await urPanel.writeProperties({values: {power: !power}}), null, 2); }
      catch (error) { output.textContent = error.message; }
      finally { button.disabled = !canWrite || power === null; }
    };
    start();
  </script>
</body>
</html>
