<!doctype html>
<!-- 文件说明：统一设备控制样板；全部状态和命令通过当前设备的 window.urPanel 获取。 -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>智能开关</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <main class="panel">
      <header class="topbar">
        <div class="identity">
          <span class="brand-icon"
            ><svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v9M7 5a8 8 0 1 0 10 0" /></svg
          ></span>
          <div>
            <h1>智能开关</h1>
            <p class="subtitle" id="device-name">舒适生活，轻松掌控</p>
          </div>
        </div>
        <div class="header-actions">
        <div class="status" id="connection">
          <i class="status-dot"></i><span id="connection-label">连接中</span>
        </div>
        <button type="button" id="settings" class="settings-button" aria-label="设备设置" title="设备设置" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 3-.6 2.1-1.7 1-2.2-.5-2.5 4.3 1.6 1.6v2l-1.6 1.6 2.5 4.3 2.2-.5 1.7 1 .6 2.1h5l.6-2.1 1.7-1 2.2.5 2.5-4.3-1.6-1.6v-2l1.6-1.6-2.5-4.3-2.2.5-1.7-1L14.5 3z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        </div>
      </header>
      <section class="card switch-hero">
        <span class="eyebrow">DEVICE CONTROL</span>
        <div class="switch-symbol">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9M7 5a8 8 0 1 0 10 0" /></svg>
        </div>
        <h2 class="hero-state" id="power-label">状态未知</h2>
        <p class="subtitle">一键控制，轻松随心</p>
        <button
          type="button"
          class="power-button"
          id="power"
          aria-label="设备电源"
          aria-pressed="false"
          disabled
        >
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9M7 5a8 8 0 1 0 10 0" /></svg>
        </button>
        <p class="subtitle" id="control-note">设备回执确认后，操作才算完成。</p>
      </section>
      <p class="feedback" id="feedback" role="status" aria-live="polite">正在读取设备状态…</p>
      <footer class="footer">
        <span class="footer-mark">联犀 · 设备控制</span><span id="data-note">状态由设备上报</span>
      </footer>
    </main>
    <script src="panel-sdk.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
